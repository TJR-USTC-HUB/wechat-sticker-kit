[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-sticker-kit"
version = "0.3.1"
description = "Turn PNG/JPG images and videos into WeChat-ready stickers: square crop, 240x240 preset, video to GIF, automatic size-limit squeezing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wechat-sticker-kit contributors" }]
keywords = ["wechat", "sticker", "emoji", "表情包", "image", "video", "gif", "converter", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=9.1"]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=7"]

[project.scripts]
wxsticker = "wechat_sticker_kit.cli:main"

[project.urls]
Homepage = "https://github.com/<your-name>/wechat-sticker-kit"

[tool.setuptools.packages.find]
where = ["src"]
